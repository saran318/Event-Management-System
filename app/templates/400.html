{% extends "base.html" %}

{% block title %}400 Bad Request{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="error-page">
            <h1 class="error-code mb-4">400</h1>
            <h3 class="mb-3">Bad Request</h3>
            <p class="lead text-muted-custom mb-5">Your browser sent a request that this server could not understand. If you were submitting a form, your session may have expired.</p>
            <a href="{{ url_for('events.list_events') }}" class="btn btn-primary btn-lg px-4"><i aria-hidden="true" class="bi bi-house-door"></i> Return Home</a>
        </div>
    </div>
</div>
{% endblock %}
