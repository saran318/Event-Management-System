{% extends "base.html" %}

{% block title %}403 Forbidden{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="error-page">
            <h1 class="error-code mb-4 text-warning">403</h1>
            <h3 class="mb-3">Access Denied</h3>
            <p class="lead text-muted-custom mb-5">You do not have permission to access this page. Please ensure you are logged in with the correct administrative credentials.</p>
            <a href="{{ url_for('events.list_events') }}" class="btn btn-primary btn-lg px-4"><i aria-hidden="true" class="bi bi-house-door"></i> Return Home</a>
        </div>
    </div>
</div>
{% endblock %}
