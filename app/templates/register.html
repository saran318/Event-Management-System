{% extends 'base.html' %}
{% block title %}Register | EventVerse{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto my-10 md:my-16">
    <div class="bg-white border border-[#CCCCCC] p-8 md:p-10 rounded-xl shadow-sm">
        <div class="text-center mb-8">
            <h2 class="text-2xl md:text-3xl font-extrabold tracking-tight text-black mb-2 leading-relaxed py-1">Create an Account</h2>
            <p class="text-xs md:text-sm text-[#555555] leading-relaxed py-1">Join the EventVerse ecosystem to discover & manage events</p>
        </div>

        <form method="POST" action="{{ url_for('auth.register') }}" class="space-y-4 form-loading">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div>
                <label for="full_name" class="block text-xs font-mono uppercase tracking-wider text-[#555555] mb-2 font-bold">Full Name</label>
                <div class="relative">
                    <i class="bi bi-person-badge absolute left-4 top-1/2 -translate-y-1/2 text-[#555555] text-lg pointer-events-none"></i>
                    <input type="text" id="full_name" name="full_name" required class="w-full pl-11 pr-4 py-3 bg-[#F9F9F9] border border-[#CCCCCC] focus:border-black focus:bg-white outline-none text-sm text-black placeholder-[#888888] rounded-md transition-colors" placeholder="e.g. John Doe">
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label for="username" class="block text-xs font-mono uppercase tracking-wider text-[#555555] mb-2 font-bold">Username</label>
                    <div class="relative">
                        <i class="bi bi-person absolute left-4 top-1/2 -translate-y-1/2 text-[#555555] text-lg pointer-events-none"></i>
                        <input type="text" id="username" name="username" required class="w-full pl-11 pr-4 py-3 bg-[#F9F9F9] border border-[#CCCCCC] focus:border-black focus:bg-white outline-none text-sm text-black placeholder-[#888888] rounded-md transition-colors" placeholder="johndoe">
                    </div>
                </div>

                <div>
                    <label for="email" class="block text-xs font-mono uppercase tracking-wider text-[#555555] mb-2 font-bold">Email Address</label>
                    <div class="relative">
                        <i class="bi bi-envelope absolute left-4 top-1/2 -translate-y-1/2 text-[#555555] text-lg pointer-events-none"></i>
                        <input type="email" id="email" name="email" required class="w-full pl-11 pr-4 py-3 bg-[#F9F9F9] border border-[#CCCCCC] focus:border-black focus:bg-white outline-none text-sm text-black placeholder-[#888888] rounded-md transition-colors" placeholder="john@example.com">
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label for="password" class="block text-xs font-mono uppercase tracking-wider text-[#555555] mb-2 font-bold">Password</label>
                    <div class="relative">
                        <i class="bi bi-lock absolute left-4 top-1/2 -translate-y-1/2 text-[#555555] text-lg pointer-events-none"></i>
                        <input type="password" id="password" name="password" required minlength="8" class="w-full pl-11 pr-11 py-3 bg-[#F9F9F9] border border-[#CCCCCC] focus:border-black focus:bg-white outline-none text-sm text-black placeholder-[#888888] rounded-md transition-colors" placeholder="Min 8 characters">
                        <button type="button" onclick="const p=document.getElementById('password'); const i=this.querySelector('i'); if(p.type==='password'){p.type='text'; i.classList.replace('bi-eye','bi-eye-slash');}else{p.type='password'; i.classList.replace('bi-eye-slash','bi-eye');}" class="absolute right-4 top-1/2 -translate-y-1/2 text-[#555555] hover:text-black focus:outline-none flex items-center justify-center transition-colors">
                            <i class="bi bi-eye text-lg"></i>
                        </button>
                    </div>
                </div>

                <div>
                    <label for="confirm_password" class="block text-xs font-mono uppercase tracking-wider text-[#555555] mb-2 font-bold">Confirm Password</label>
                    <div class="relative">
                        <i class="bi bi-lock-fill absolute left-4 top-1/2 -translate-y-1/2 text-[#555555] text-lg pointer-events-none"></i>
                        <input type="password" id="confirm_password" name="confirm_password" required minlength="8" class="w-full pl-11 pr-11 py-3 bg-[#F9F9F9] border border-[#CCCCCC] focus:border-black focus:bg-white outline-none text-sm text-black placeholder-[#888888] rounded-md transition-colors" placeholder="Re-enter password">
                        <button type="button" onclick="const p=document.getElementById('confirm_password'); const i=this.querySelector('i'); if(p.type==='password'){p.type='text'; i.classList.replace('bi-eye','bi-eye-slash');}else{p.type='password'; i.classList.replace('bi-eye-slash','bi-eye');}" class="absolute right-4 top-1/2 -translate-y-1/2 text-[#555555] hover:text-black focus:outline-none flex items-center justify-center transition-colors">
                            <i class="bi bi-eye text-lg"></i>
                        </button>
                    </div>
                </div>
            </div>

            <button type="submit" class="w-full py-3.5 bg-black text-white font-mono text-xs font-bold uppercase tracking-[0.15em] hover:bg-neutral-800 transition-colors mt-4 flex items-center justify-center gap-2 rounded-md">
                <i class="bi bi-person-plus text-lg"></i>
                Register Account
            </button>
        </form>

        <div class="mt-8 pt-6 border-t border-[#CCCCCC] text-center">
            <p class="text-xs text-[#555555]">
                Already have an account? 
                <a href="{{ url_for('auth.login') }}" class="font-bold text-black hover:underline ml-1">Sign in here</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
