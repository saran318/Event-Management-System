{% extends "base.html" %}

{% block title %}500 Internal Server Error{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="error-page">
            <h1 class="error-code mb-4 text-danger">500</h1>
            <h3 class="mb-3">Internal Server Error</h3>
            <p class="lead text-muted-custom mb-5">Oops! Something went wrong on our servers. We've logged the error and will investigate it shortly.</p>
            <a href="{{ url_for('events.list_events') }}" class="btn btn-primary btn-lg px-4"><i aria-hidden="true" class="bi bi-house-door"></i> Return Home</a>
        </div>
    </div>
</div>
{% endblock %}
