{% extends "base.html" %}

{% block title %}404 Not Found{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="error-page">
            <h1 class="error-code mb-4">404</h1>
            <h3 class="mb-3">Page Not Found</h3>
            <p class="lead text-muted-custom mb-5">The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.</p>
            <a href="{{ url_for('events.list_events') }}" class="btn btn-primary btn-lg px-4"><i aria-hidden="true" class="bi bi-house-door"></i> Return Home</a>
        </div>
    </div>
</div>
{% endblock %}
